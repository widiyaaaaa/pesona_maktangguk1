<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Aduan - Maktangguk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8f3;
            color: #333;
        }

        .admin-section {
            min-height: 100vh;
            padding: 50px 20px;
        }

        .admin-container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .login {
            max-width: 500px;
            margin-top: 50px;
        }

        h1,
        h2 {
            text-align: center;
            color: #315c3b;
        }

        .subjudul {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #315c3b;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd8ce;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #39734a;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #39734a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #285c38;
        }

        .logout {
            background: #a51d1d;
            margin-top: 30px;
        }

        .logout:hover {
            background: #831515;
        }

        .hidden {
            display: none;
        }

        /* KARTU ADUAN */
        .aduan-card {
            margin-top: 25px;
            padding: 22px;
            border-radius: 12px;
            background: #f3f8f3;
            border-left: 5px solid #39734a;
        }

        .aduan-card p {
            line-height: 1.6;
            margin: 8px 0;
        }

        .aduan-card strong {
            color: #315c3b;
        }

        .token {
            background: #e1f0e4;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            color: #176b2d;
            margin-bottom: 15px;
        }

        /* STATUS */
        .status {
            padding: 7px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 13px;
        }

        .sudah {
            background: #d9f5df;
            color: #176b2d;
        }

        .belum {
            background: #fff0c7;
            color: #856404;
        }

        /* PESAN */
        .pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .sukses {
            background: #d9f5df;
            color: #176b2d;
        }

        .gagal {
            background: #ffe0e0;
            color: #a51d1d;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .jumlah {
            background: #39734a;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .tanggapan-lama {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #d5e2d7;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {

            .admin-section {
                padding: 25px 12px;
            }

            .admin-container {
                padding: 20px;
            }

            h2 {
                font-size: 22px;
            }

            .aduan-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<section class="admin-section">

    <!-- ========================= -->
    <!-- LOGIN ADMIN -->
    <!-- ========================= -->

    <div class="admin-container login" id="loginBox">

        <h2>🔐 Login Admin</h2>

        <p class="subjudul">
            Silakan login untuk mengelola aduan masyarakat.
        </p>

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            autocomplete="username"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            🔑 Login
        </button>

        <div id="loginPesan"></div>

    </div>


    <!-- ========================= -->
    <!-- DASHBOARD ADMIN -->
    <!-- ========================= -->

    <div class="admin-container hidden" id="adminBox">

        <h2>📢 Dashboard Admin</h2>

        <p class="subjudul">
            Daftar aduan yang telah dikirim oleh masyarakat.
        </p>

        <div id="jumlahAduan"></div>

        <div id="daftarAduan">
            <div class="loading">
                ⏳ Memuat data aduan...
            </div>
        </div>

        <button class="logout" onclick="logout()">
            🚪 Logout
        </button>

    </div>

</section>


<script>

/* =========================================
   URL GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwkN_L8a4pupOPczCy3iC-FQzytRUTwbFVT6-ekkc-RPL9s3us8_0BwtUXzMpN5bkdqZw/exec";


/* =========================================
   LOGIN ADMIN
========================================= */

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const pesan =
        document.getElementById("loginPesan");


    if (
        username === "admin" &&
        password === "admin123"
    ) {

        document
            .getElementById("loginBox")
            .classList.add("hidden");

        document
            .getElementById("adminBox")
            .classList.remove("hidden");

        tampilkanAduan();

    } else {

        pesan.className = "pesan gagal";

        pesan.innerHTML =
            "❌ Username atau password salah.";

    }
}


/* =========================================
   TAMPILKAN SEMUA ADUAN
========================================= */

function tampilkanAduan() {

    const daftar =
        document.getElementById("daftarAduan");

    const jumlah =
        document.getElementById("jumlahAduan");


    daftar.innerHTML = `
        <div class="loading">
            ⏳ Memuat data aduan...
        </div>
    `;


    fetch(API_URL + "?action=semua")

        .then(response => response.json())

        .then(result => {

            if (result.status !== "success") {

                daftar.innerHTML = `
                    <div class="pesan gagal">
                        ❌ Gagal mengambil data aduan.
                    </div>
                `;

                return;
            }


            /* =========================
               JIKA BELUM ADA ADUAN
            ========================= */

            if (!result.data || result.data.length === 0) {

                jumlah.innerHTML = "";

                daftar.innerHTML = `
                    <div class="pesan">
                        📭 Belum ada aduan yang masuk.
                    </div>
                `;

                return;
            }


            /* =========================
               JUMLAH ADUAN
            ========================= */

            jumlah.innerHTML = `
                <div class="jumlah">
                    📋 Total Aduan: ${result.data.length}
                </div>
            `;


            daftar.innerHTML = "";


            /* =========================
               URUTKAN TERBARU DI ATAS
            ========================= */

            const dataAduan =
                [...result.data].reverse();


            dataAduan.forEach(data => {

                const tanggapan =
                    data.tanggapan || "";


                let statusHTML;


                if (tanggapan) {

                    statusHTML = `
                        <span class="status sudah">
                            ✅ Sudah ditanggapi
                        </span>
                    `;

                } else {

                    statusHTML = `
                        <span class="status belum">
                            ⏳ Belum ditanggapi
                        </span>
                    `;

                }


                daftar.innerHTML += `

                    <div class="aduan-card">

                        <div class="token">
                            🔑 Token Aduan:
                            ${data.token}
                        </div>


                        <p>
                            <strong>👤 Nama Pengirim:</strong><br>
                            ${data.nama || "-"}
                        </p>


                        <p>
                            <strong>📧 Email:</strong><br>
                            ${data.email || "-"}
                        </p>


                        <p>
                            <strong>📂 Kategori:</strong><br>
                            ${data.kategori || "-"}
                        </p>


                        <p>
                            <strong>📝 Judul:</strong><br>
                            ${data.judul || "-"}
                        </p>


                        <p>
                            <strong>📢 Isi Aduan:</strong><br>
                            ${data.aduan || "-"}
                        </p>


                        <p>
                            <strong>📅 Tanggal:</strong><br>
                            ${formatTanggal(data.tanggal)}
                        </p>


                        <p>
                            <strong>📌 Status:</strong><br>
                            ${statusHTML}
                        </p>


                        ${
                            tanggapan
                            ?
                            `
                            <div class="tanggapan-lama">

                                <strong>
                                    💬 Tanggapan Saat Ini:
                                </strong>

                                <br><br>

                                ${tanggapan}

                            </div>
                            `
                            :
                            ""
                        }


                        <label>
                            Tanggapan Admin
                        </label>


                        <textarea
                            id="tanggapan-${data.token}"
                            rows="5"
                            placeholder="Tuliskan tanggapan untuk pengadu..."
                        >${tanggapan}</textarea>


                        <button
                            onclick="simpanTanggapan('${data.token}')"
                        >
                            💾 Simpan Tanggapan
                        </button>


                        <div
                            id="pesan-${data.token}">
                        </div>

                    </div>

                `;

            });

        })

        .catch(error => {

            daftar.innerHTML = `
                <div class="pesan gagal">
                    ❌ Gagal terhubung ke server.
                </div>
            `;

            console.error(error);

        });
}


/* =========================================
   SIMPAN TANGGAPAN
========================================= */

function simpanTanggapan(token) {

    const textarea =
        document.getElementById(
            "tanggapan-" + token
        );

    const pesan =
        document.getElementById(
            "pesan-" + token
        );


    if (!textarea) {

        return;
    }


    const tanggapan =
        textarea.value.trim();


    /* =========================
       VALIDASI
    ========================= */

    if (!tanggapan) {

        pesan.className =
            "pesan gagal";

        pesan.innerHTML =
            "❌ Tanggapan belum diisi.";

        return;
    }


    pesan.className =
        "pesan";

    pesan.innerHTML =
        "⏳ Menyimpan tanggapan...";


    /* =========================
       KIRIM KE GOOGLE SHEET
    ========================= */

    fetch(API_URL, {

        method: "POST",

        body: JSON.stringify({

            action: "tanggapan",

            token: token,

            tanggapan: tanggapan

        })

    })

    .then(response => response.json())

    .then(result => {

        if (result.status === "success") {

            pesan.className =
                "pesan sukses";

            pesan.innerHTML =
                "✅ Tanggapan berhasil disimpan.";

        } else {

            pesan.className =
                "pesan gagal";

            pesan.innerHTML =
                "❌ " + result.message;

        }

    })

    .catch(error => {

        pesan.className =
            "pesan gagal";

        pesan.innerHTML =
            "❌ Gagal menyimpan tanggapan.";

        console.error(error);

    });

}


/* =========================================
   FORMAT TANGGAL
========================================= */

function formatTanggal(tanggal) {

    if (!tanggal) {
        return "-";
    }

    try {

        const date =
            new Date(tanggal);

        if (isNaN(date.getTime())) {
            return tanggal;
        }

        return date.toLocaleString(
            "id-ID",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch (error) {

        return tanggal;

    }
}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    document
        .getElementById("adminBox")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");


    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("loginPesan").innerHTML = "";

    document.getElementById("daftarAduan").innerHTML = "";

    document.getElementById("jumlahAduan").innerHTML = "";

}

</script>

</body>
</html>
